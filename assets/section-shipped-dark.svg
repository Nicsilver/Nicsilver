<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="More things I've made">
<style>
@font-face{font-family:'InterSemi';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'InterDisplayX';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}

.up{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.3,1.5,.5,1) both}
.rise{animation:rise 1.3s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.6,0,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
</style>
<defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0.00" stop-color="#7c5cff"/><stop offset="0.20" stop-color="#2f8cff"/><stop offset="0.40" stop-color="#14b88a"/><stop offset="0.60" stop-color="#f5b53d"/><stop offset="0.80" stop-color="#ff7a3d"/><stop offset="1.00" stop-color="#ff4d6d"/></linearGradient><linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" x2="600" spreadMethod="repeat"><stop offset="0.00" stop-color="#7c5cff"/><stop offset="0.17" stop-color="#2f8cff"/><stop offset="0.33" stop-color="#14b88a"/><stop offset="0.50" stop-color="#f5b53d"/><stop offset="0.67" stop-color="#ff7a3d"/><stop offset="0.83" stop-color="#ff4d6d"/><stop offset="1.00" stop-color="#7c5cff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0" dur="6s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<g transform="translate(30 66)"><g class="pop"><path d="M 0 -16 C 2 -4 4 -2 16 0 C 4 2 2 4 0 16 C -2 4 -4 2 -16 0 C -4 -2 -2 -4 0 -16 Z" fill="url(#flow)" filter="url(#glow)" opacity="0.8"/><path d="M 0 -16 C 2 -4 4 -2 16 0 C 4 2 2 4 0 16 C -2 4 -4 2 -16 0 C -4 -2 -2 -4 0 -16 Z" fill="url(#flow)"><animateTransform attributeName="transform" type="rotate" values="0;90" dur="4s" repeatCount="indefinite"/></path></g></g>
<g class="up" style="animation-delay:0.10s"><text x="62" y="44" font-family="InterSemi, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="url(#flow)" letter-spacing="3">02  /  SHIPPED</text></g>
<g class="up" style="animation-delay:0.20s"><text x="60" y="86" font-family="InterDisplayX, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#eef1f6" letter-spacing="-0.8">More things I've made</text></g>
<rect class="grow" style="animation-delay:0.40s" x="62" y="104" width="400" height="4" rx="2" fill="url(#flow)"/>
<rect class="grow" style="animation-delay:0.70s" x="476" y="105.5" width="724" height="1" fill="#ffffff" fill-opacity="0.10"/>
</svg>
